
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TapStar | Tap. Connect. Review.</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #101827;
      color: #F4F7FB;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 38px 24px;
      border: 1px solid #34445a;
      border-radius: 22px;
      background: #192638;
    }

    .logo {
      color: #60D5FF;
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h1 { font-size: 25px; margin-top: 32px; }

    p {
      color: #c2ccda;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin-top: 28px;
      padding: 16px;
      border-radius: 12px;
      background: #60D5FF;
      color: #101827;
      font-weight: bold;
      text-decoration: none;
    }

    .note {
      margin-top: 24px;
      font-size: 12px;
      color: #9eacbf;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">✦ TapStar</div>

    <h1>Welcome to Your Business</h1>

    <p>
      Thank you for visiting us!
      We would love to hear about your experience.
    </p>

    <a class="button" href="#" onclick="alert('The business Google Review link will be added here.'); return false;">
      Write a Google Review
    </a>

    <p class="note">Tap. Connect. Review.</p>
  </main>
</body>
</html>
